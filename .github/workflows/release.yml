name: Release MSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "4-part MSIX version (e.g. 2.2.0.0). Leave empty to keep manifest version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-release:
    runs-on: windows-latest
    shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Resolve version and update AppxManifest
        id: version
        run: |
          $manifestPath = "CryptoDock/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath -Raw
          $manifestVersion = $manifest.Package.Identity.Version

          $requested = "${{ inputs.package_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($requested) -and $env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $numericPart = ($tag -replace '^v', '') -split '-' | Select-Object -First 1
            $parts = $numericPart.Split('.', [System.StringSplitOptions]::RemoveEmptyEntries)
            while ($parts.Count -lt 4) { $parts += "0" }
            $requested = ($parts[0..3] -join '.')
            $releaseLabel = $tag
          } elseif (-not [string]::IsNullOrWhiteSpace($requested)) {
            $releaseLabel = "v$requested"
          } else {
            $requested = $manifestVersion
            $releaseLabel = "v$manifestVersion"
          }

          if ($requested -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Invalid 4-part MSIX version '$requested'. Expected format: Major.Minor.Build.Revision"
          }

          if ($manifest.Package.Identity.Version -ne $requested) {
            $manifest.Package.Identity.Version = $requested
            $manifest.Save((Resolve-Path $manifestPath))
          }

          "msix_version=$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_label=$releaseLabel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using MSIX version $requested (label: $releaseLabel)"

      - name: Restore and run unit tests
        run: |
          dotnet restore CryptoDock.sln -p:Platform=x64
          dotnet test CryptoDock.Tests/CryptoDock.Tests.csproj --configuration Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Prepare signing certificate and build Release MSIX
        env:
          MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "CryptoDock_Signing.pfx"

          if (-not [string]::IsNullOrWhiteSpace($env:MSIX_CERT_BASE64)) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
            $certPassword = $env:MSIX_CERT_PASSWORD
            $securePassword = ConvertTo-SecureString -String $certPassword -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
            $thumbprint = $imported[0].Thumbprint
            Write-Host "Loaded signing certificate from secret (thumbprint: $thumbprint)"
          } else {
            $certPassword = [Guid]::NewGuid().ToString("N")
            $securePassword = ConvertTo-SecureString -String $certPassword -Force -AsPlainText
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=CryptoDock" `
              -KeyUsage DigitalSignature `
              -FriendlyName "CryptoDock Release Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
            $thumbprint = $cert.Thumbprint
            Write-Host "Generated temporary self-signed certificate (thumbprint: $thumbprint)"
          }

          dotnet build CryptoDock/CryptoDock.csproj `
            --configuration Release `
            --no-restore `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$pfxPath" `
            -p:PackageCertificatePassword="$certPassword" `
            -p:PackageCertificateThumbprint="$thumbprint"

      - name: Archive Release MSIX package
        id: archive
        run: |
          $testDirs = Get-ChildItem -Path "CryptoDock/AppPackages" -Directory -Filter "*_x64_Test" |
            Where-Object { $_.Name -notlike "*_Debug_Test" }
          if (-not $testDirs) {
            throw "Expected MSIX AppPackages test output directory under CryptoDock/AppPackages."
          }

          $packageDir = $testDirs | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $zipName = "CryptoDock-${{ steps.version.outputs.release_label }}-win-x64-msix.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          Get-ChildItem -Path $packageDir.FullName -Filter "*.pfx" -Recurse | Remove-Item -Force
          Compress-Archive -Path "$($packageDir.FullName)\*" -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Created release archive at $zipPath"

      - name: Upload MSIX Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoDock-${{ steps.version.outputs.release_label }}-win-x64-msix
          path: ${{ steps.archive.outputs.zip_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.archive.outputs.zip_path }}
          body: |
            ### Local Sideload Installation (Windows x64)

            1. Download `${{ steps.archive.outputs.zip_name }}` and extract it.
            2. Open **PowerShell** in the extracted folder and run:
               ```powershell
               Get-AppxPackage *CryptoDock* | Remove-AppxPackage
               .\Install.ps1 -Force
               ```
               *(If Windows asks for certificate trust on first install, `Install.ps1 -Force` prompts/installs the `.cer` certificate to `TrustedPeople` when run with sufficient privileges, or import the included `.cer` manually into `Cert:\CurrentUser\TrustedPeople`.)*
            3. Open **PowerToys Command Palette**, run **Reload Command Palette Extension**, and pin **Crypto Tickers** to the Dock.
